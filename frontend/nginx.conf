server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy WebSocket traffic straight through to the backend container over
    # the internal Docker network, so the browser only ever talks to this one
    # origin. This is what lets the frontend avoid hardcoding a backend URL.
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}